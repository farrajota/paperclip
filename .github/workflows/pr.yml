name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # The caller and reusable workflow are reviewed together in this fork.
    uses: ./.github/workflows/pr-trusted.yml

  fork-gate:
    # The single required check for zay/main. The upstream aggregates
    # (`verify`, `e2e`) leave out the serialized suites and the canary, and a
    # skipped matrix job counts as passing, so gate on the whole called
    # workflow instead. A label event other than profile-ci skips `ci`; the
    # guard keeps that event from posting a failing fork-gate on a head SHA
    # whose real run already passed.
    name: fork-gate
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "$CI_RESULT" = "success"

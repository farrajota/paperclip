name: Dependency review

# Fork-local replacement for upstream's "commitperclip PR Review". Upstream's
# workflow mints a token for its commitperclip GitHub App from COMMITPERCLIP_KEY,
# a private key only upstream holds, so in this fork it failed on every PR. The
# fork keeps only the dependency review step, which needs no secret; the fork's
# own PR workflow (pr.yml) and the fork-gate check carry the quality gates.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs this file from the base branch; it never checks out
# or executes PR code. The action reads both revisions through the API.

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs the base-branch workflow. These steps check out only
# the event's trusted base SHA and never execute PR-controlled files.

permissions:
  pull-requests: read
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Dependency Review
        id: dependency_review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run quality gates
        id: quality
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      # Run both independent reviews, then fail the job if either one fails.
      - name: Fail if quality gates failed
        if: always() && (steps.quality.outcome == 'failure' || steps.dependency_review.outcome == 'failure')
        run: |
          echo "Dependency review or one or more PR quality gates failed."
          exit 1
